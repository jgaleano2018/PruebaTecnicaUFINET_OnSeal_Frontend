# Levanta backend (8080) y frontend (5173):  docker compose up --build
name: prueba-ufinet

services:
  backend:
    build:
      context: ../BackendUfinet
    container_name: ufinet-backend
    ports:
      - "8080:8080"
    environment:
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: ufinet-frontend
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
